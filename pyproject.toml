[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mon-agent"
version = "0.1.0"
description = "Monitoring extensions for mini-SWE-agent on SWE-bench style runs"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Bradley Zhu"},
]
dependencies = [
  "mini-swe-agent @ git+https://github.com/SWE-agent/mini-SWE-agent@ed58678c7e4670e1ffcbac35e90ca6ac8a5ddf7c",
]

[project.optional-dependencies]
vllm = [
  "vllm>=0.6.0",
]
alarm-monitor = [
  "lightgbm>=4.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "xgboost>=2.0",
]

[project.urls]
Repository = "https://github.com/Bradley-Zhu/mon-agent"

[project.scripts]
mon-agent-runner = "mon_agent.runner:app"
mon-agent-retry-runner = "mon_agent.retry_runner:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["mon_agent*"]
